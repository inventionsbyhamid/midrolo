<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontconfig for the share images (config/initializers/fonts.rb points FONTCONFIG_FILE here). It adds this folder's
  Archivo instances, static cuts of the variable Archivo (SIL OFL 1.1, see OFL.txt) named so fontconfig matches them
  by family alone:
    ArchivoWide 800   wdth 125, wght 800 (the display cut: titles, the wordmark)
    Archivo 400, 600  wdth 100
  then includes the system's own config, for fallback glyphs and the font cache, wherever the platform keeps it.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/usr/local/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>
</fontconfig>
