<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Where an episode's first week puts it</title>
<desc id="d">Buzzsprout, September 2026: the bottom half of episodes get 0 to 26 downloads in their first 7 days, the next 25% get 27 to 95, the next 15% get 96 to 411, the top 10% start at 412, the top 5% at 1,007 and the top 1% at 4,586.</desc>
<rect width="800" height="450" fill="#ffffff"/>
<text x="32" y="50" font-size="28" font-weight="700" fill="#22132b">Where an episode's first week puts it</text>
<text x="32" y="82" font-size="18" fill="#5a4a63">Downloads in the first 7 days. Each block is a share of all episodes.</text>
<rect x="32.0" y="176" width="368.0" height="92" fill="#eee5f3"/>
<rect x="400.0" y="176" width="184.0" height="92" fill="#d6c3e4"/>
<line x1="400.0" y1="176" x2="400.0" y2="268" stroke="#ffffff" stroke-width="2"/>
<rect x="584.0" y="176" width="110.4" height="92" fill="#a77fc4"/>
<line x1="584.0" y1="176" x2="584.0" y2="268" stroke="#ffffff" stroke-width="2"/>
<rect x="694.4" y="176" width="36.8" height="92" fill="#7a4aa0"/>
<line x1="694.4" y1="176" x2="694.4" y2="268" stroke="#ffffff" stroke-width="2"/>
<rect x="731.2" y="176" width="29.4" height="92" fill="#4a2266"/>
<line x1="731.2" y1="176" x2="731.2" y2="268" stroke="#ffffff" stroke-width="2"/>
<rect x="760.6" y="176" width="7.4" height="92" fill="#f3a712"/>
<line x1="760.6" y1="176" x2="760.6" y2="268" stroke="#ffffff" stroke-width="2"/>
<text x="216.0" y="216" font-size="20" font-weight="700" fill="#22132b" text-anchor="middle">Bottom half</text>
<text x="216.0" y="242" font-size="18" fill="#22132b" text-anchor="middle">0 to 26</text>
<text x="492.0" y="216" font-size="20" font-weight="700" fill="#22132b" text-anchor="middle">Next 25%</text>
<text x="492.0" y="242" font-size="18" fill="#22132b" text-anchor="middle">27 to 95</text>
<text x="639.2" y="216" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Next 15%</text>
<text x="639.2" y="242" font-size="18" fill="#ffffff" text-anchor="middle">96 to 411</text>
<line x1="584.0" y1="146" x2="584.0" y2="274" stroke="#f3a712" stroke-width="4"/>
<text x="572.0" y="136" font-size="18" font-weight="700" fill="#22132b" text-anchor="end">96 downloads puts an episode in the top 25%</text>
<rect x="452" y="302" width="20" height="20" rx="4" fill="#7a4aa0"/>
<text x="482" y="318" font-size="18" fill="#22132b">Top 10%: 412 to 1,006</text>
<rect x="452" y="338" width="20" height="20" rx="4" fill="#4a2266"/>
<text x="482" y="354" font-size="18" fill="#22132b">Top 5%: 1,007 to 4,585</text>
<rect x="452" y="374" width="20" height="20" rx="4" fill="#f3a712"/>
<text x="482" y="390" font-size="18" fill="#22132b">Top 1%: 4,586 or more</text>
<path d="M694.4 276 v14 M768.0 276 v14 M694.4 283 H768.0" stroke="#5a4a63" stroke-width="2" fill="none"/>
<text x="32" y="330" font-size="18" fill="#5a4a63">Most shows are small.</text>
<text x="32" y="356" font-size="18" fill="#5a4a63">A few hundred first week</text>
<text x="32" y="382" font-size="18" fill="#5a4a63">downloads is already rare.</text>
<text x="32" y="428" font-size="15" fill="#5a4a63">Source: Buzzsprout stats, September 2026 (buzzsprout.com/stats)</text>
</svg>
