<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Change not saved (422) | Midrolo</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #f6f2f4;
        color: #22132b;
        font-family: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 1rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { width: 100%; max-width: 40rem; margin: 0 auto; padding: 0 1rem; }
      header { padding-top: 1.25rem; }
      .logo { display: inline-flex; align-items: center; gap: 0.5rem; color: #22132b; text-decoration: none; }
      .logo svg { width: 1.75rem; height: 1.75rem; }
      .logo span { font-size: 1.3125rem; font-stretch: 125%; font-weight: 800; letter-spacing: -0.03em; }
      main { flex: 1; display: flex; align-items: center; padding: 3rem 0 5rem; }
      .line { display: block; width: 100%; max-width: 16rem; height: 1.5rem; color: #8e7f95; margin-bottom: 1.5rem; }
      .code { font-size: 0.875rem; color: #5a4a63; }
      h1 {
        margin-top: 0.5rem;
        font-size: clamp(2rem, 1.5rem + 2.4vw, 3rem);
        font-stretch: 118%;
        font-weight: 760;
        line-height: 1.05;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }
      p.body { margin-top: 1rem; max-width: 34rem; font-size: 1.125rem; color: #5a4a63; text-wrap: pretty; }
      .btn {
        display: inline-flex;
        align-items: center;
        height: 2.75rem;
        margin-top: 2rem;
        padding: 0 1.25rem;
        border-radius: 0.625rem;
        background: #22132b;
        color: #fff;
        font-weight: 650;
        text-decoration: none;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.14), 0 1px 0 rgb(34 19 43 / 0.25);
      }
      .btn:hover { background: #4a2266; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 2rem; }
      .actions .btn { margin-top: 0; }
      .btn-secondary { background: #fff; color: #22132b; box-shadow: inset 0 0 0 1px #8e7f95; }
      .btn-secondary:hover { background: #eee5f3; }
      :focus-visible { outline: 3px solid #f3a712; outline-offset: 2px; box-shadow: 0 0 0 2px #22132b; }
    </style>
  </head>
  <body>
    <header class="wrap">
      <a class="logo" href="/" aria-label="Midrolo home">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <rect x="0.75" y="11" width="2.5" height="6" rx="1.25" fill="currentColor"/>
          <rect x="4.75" y="9" width="2.5" height="10" rx="1.25" fill="currentColor"/>
          <rect x="8.75" y="6" width="2.5" height="16" rx="1.25" fill="currentColor"/>
          <rect x="12.75" y="2" width="2.5" height="24" rx="1.25" fill="#f3a712"/>
          <rect x="16.75" y="6" width="2.5" height="16" rx="1.25" fill="currentColor"/>
          <rect x="20.75" y="9" width="2.5" height="10" rx="1.25" fill="currentColor"/>
          <rect x="24.75" y="11" width="2.5" height="6" rx="1.25" fill="currentColor"/>
        </svg>
        <span>Midrolo</span>
      </a>
    </header>
    <main class="wrap">
      <div>
        <svg class="line" viewBox="0 0 256 24" aria-hidden="true">
          <path d="M0 12H116M140 12H256" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <rect x="120" y="9" width="16" height="6" rx="3" fill="#f3a712"/>
        </svg>
        <p class="code">Error 422</p>
        <h1>That change wasn't saved</h1>
        <p class="body">We couldn't confirm the form came from you, usually because the page was open for a long time or sent twice. Go back, reload the page and try again.</p>
        <p class="actions">
          <a class="btn" href="/">Go to the home page</a>
          <a class="btn btn-secondary" href="/podcasts">Find podcasts to sponsor</a>
        </p>
      </div>
    </main>
  </body>
</html>
