# Plan limits and pricing: the single source of plan numbers (spec §11, R59). Entitlements reads the limits; each plan's
# price_keys name its prices, and product_ids maps every price key to each provider's product id (set via ENV).
# - snapshots_per_month, agent_reports and pitches count per usage period: the subscription's, else the calendar month.
#   With agent_reports_total, agent reports count all time instead, in the plan's own spend bucket (judge, promo).
# - pitches: unlimited is bounded by the LLM budget only.
# - visible_matches caps the matches a Snapshot shows; 50 is the agent report's own match cap, so it means all of them.
# - grants_plan: the plan starts from that plan's limits and features; its own keys win.
shared:
  free:
    name: Free
    price_monthly_usd: 0
    shows: 1
    snapshots_per_month: 1
    agent_reports: 0
    pitches: 0
    visible_matches: 5
    kit_badge: true
    deep_scan_similar: 8
    csv_export: false
    pipeline: false
  creator:
    name: Creator
    price_monthly_usd: 19
    price_yearly_usd: 190
    shows: 1
    snapshots_per_month: 4
    agent_reports: 4
    pitches: 40
    visible_matches: 50
    kit_badge: false
    deep_scan_similar: 8
    csv_export: false
    pipeline: true
    price_keys:
      monthly: creator_monthly
      yearly: creator_yearly
  pro:
    name: Pro
    price_monthly_usd: 49
    price_yearly_usd: 490
    shows: 3
    snapshots_per_month: 12
    agent_reports: 12
    pitches: 150
    visible_matches: 50
    kit_badge: false
    deep_scan_similar: 12
    csv_export: true
    pipeline: true
    price_keys:
      monthly: pro_monthly
      yearly: pro_yearly
  sprint:
    name: Sprint
    price_once_usd: 49
    grants_plan: pro
    duration_days: 30
    price_keys:
      once: sprint
  # Derived plans, never sold (R59): judge access (users.judge, set by an admin) and the Pro trial (promo_pro_until).
  # R151: the trial is every signed-in account's plan while it runs: 3 shows, each with a Snapshot and a full report.
  # Its name is what a user reads on the account page, so it says what it is, not why it exists.
  judge:
    name: Judge access
    grants_plan: pro
    shows: 3
    snapshots_per_month: 12
    agent_reports: 3
    agent_reports_total: true
    pitches: unlimited
  promo:
    name: Pro trial
    grants_plan: pro
    shows: 3
    snapshots_per_month: 3
    agent_reports: 3
    agent_reports_total: true
    pitches: 60
  # provider name => price_key => that provider's product id, from ENV (blank until set). Billing reads the chosen
  # provider's (Billing::Provider, R145); a new provider adds its own block. It sits under shared because config_for
  # loads nothing outside shared and the environment sections.
  product_ids:
    dodo:
      creator_monthly: <%= ENV["DODO_PRODUCT_CREATOR_MONTHLY"] %>
      creator_yearly: <%= ENV["DODO_PRODUCT_CREATOR_YEARLY"] %>
      pro_monthly: <%= ENV["DODO_PRODUCT_PRO_MONTHLY"] %>
      pro_yearly: <%= ENV["DODO_PRODUCT_PRO_YEARLY"] %>
      sprint: <%= ENV["DODO_PRODUCT_SPRINT"] %>
