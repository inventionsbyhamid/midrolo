# Sponsor detection in episode notes (Sponsors::Scan, lane L2). The brand-name denylist is config/proven_scan.yml's
# (platforms and self-promotion); this file adds what the episode-level scan needs on top of it. Compared on
# normalized registrable domains (Brand.normalize_domain) and normalized words (Research::Names.normalize).
shared:
  # Sites a show links to that are never the sponsor of a read: platforms, podcast apps and hosts, link pages and
  # shorteners, stores where hosts sell their own merch, donation and ticket sites, and the big general sites show
  # notes cite (a book on Amazon, an article on a newspaper's site). A brand named in a "sponsored by" line still
  # counts by name; only domain-led signals skip these.
  platform_domains:
    # social and video
    - youtube.com
    - youtu.be
    - instagram.com
    - instagr.am
    - tiktok.com
    - facebook.com
    - fb.me
    - fb.com
