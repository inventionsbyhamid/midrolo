  # Capitalised words a "sponsored by" capture can start with that are never a brand ("brought to you by Listeners
  # Like You", "Sponsors: Email us"). Normalized like brand names.
  not_brands:
    - our
    - my
    - your
    - his
    - her
    - their
    - you
    - us
    - me
    - we
    - everyone
