# USD per 1M tokens.
shared:
  # OpenRouter models: each request goes to one of many hosts, at different prices. Llm.provider_options sends these
  # input and output prices as OpenRouter's max_price, so no host above them is used and the ledger never
  # undercounts. On 2026-10-29 the caps admit 19 of 49 GLM 5.3 hosts, all 38 GLM 5.3 Flash hosts and 37 of 39
  # DeepSeek hosts. GLM 5.3 is the default (R146): in a head-to-head on the demo shows it saved the most matches, named
  # brands in the summary and cited proven sponsors, at about 2 cents a report.
  deepseek/deepseek-v4.1-flash:
    input: 0.30
    output: 1.20
    cache_read: 0.03
  z-ai/glm-5.3-flash:
    input: 0.30
    output: 1.20
    cache_read: 0.06
  z-ai/glm-5.3:
    input: 1.00
    output: 3.20
    cache_read: 0.20
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write: 5.00
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
