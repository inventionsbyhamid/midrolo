# USD per 1M tokens.
shared:
  # OpenRouter models: each request goes to one of many hosts, at different prices. Llm.provider_options sends these
  # input and output prices as OpenRouter's max_price, so no host above them is used and the ledger never
  # undercounts. On 2026-10-29 the DeepSeek caps admit 37 of 39 hosts, the GLM caps 19 of 49.
  deepseek/deepseek-v4.1-flash:
    input: 0.30
    output: 1.20
    cache_read: 0.03
  z-ai/glm-5.3:
    input: 1.00
    output: 3.20
    cache_read: 0.20
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write: 5.00
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
