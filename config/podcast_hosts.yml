# Podcast hosting providers, detected from a feed's enclosure (media) URLs by Catalog::Detection, then from the feed
# URL itself: key => { name: what people read, hosts: domains }. A URL's host matches a domain when it is that domain
# or ends with "." and that domain. Measurement prefixes (config/measurement_prefixes.yml) come off an enclosure URL
# first, so the host compared is the media file's own. The key is what podcasts.hosting_provider stores.
acast:
  name: Acast
  hosts: [acast.com, acastcdn.com]
art19:
  name: ART19
  hosts: [art19.com]
