#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  requeue_stranded_billing_events:
    class: RequeueStrandedBillingEventsJob
    schedule: every 10 minutes
  purge_unattached_blobs:
    class: PurgeUnattachedBlobsJob
    schedule: every day at 4:40am
  # The marketplace (build spec section 7): feed checks for podcasts that are due, stats syncs for pending invites and
  # active connections, and readings that expired.
  refresh_due_podcasts:
    class: Catalog::RefreshDueJob
    schedule: every 10 minutes
  sync_due_stats:
    class: Stats::SyncDueJob
    schedule: every 15 minutes
  expire_stat_readings:
    class: Stats::ExpireReadingsJob
    schedule: every day at 3:20am
