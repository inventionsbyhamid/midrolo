shared:
  provider: <%= ENV.fetch("LLM_PROVIDER", "anthropic") %>
  daily_budget_usd: <%= ENV.fetch("LLM_DAILY_BUDGET_USD", 5) %>
  # Never send temperature. Agent thinks at medium effort; pitches at low.
  agent:
    model: <%= ENV.fetch("LLM_AGENT_MODEL", "claude-opus-5-5") %>
    effort: medium
    max_tool_calls: 40
    max_seconds: 360
  pitch:
    model: <%= ENV.fetch("LLM_PITCH_MODEL", "claude-opus-5-5") %>
    effort: low
