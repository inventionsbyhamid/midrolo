shared:
  provider: <%= ENV.fetch("LLM_PROVIDER", "openrouter") %>
  daily_budget_usd: <%= ENV.fetch("LLM_DAILY_BUDGET_USD", 5) %>
  # Never send temperature. Agent thinks at medium effort; pitches at low.
  # Models are OpenRouter ids by default; with LLM_PROVIDER=anthropic use Anthropic's (claude-opus-5-5).
  agent:
    model: <%= ENV.fetch("LLM_AGENT_MODEL", "z-ai/glm-5.3") %>
    effort: medium
    max_tool_calls: 40
    max_seconds: 360
  pitch:
    model: <%= ENV.fetch("LLM_PITCH_MODEL", "z-ai/glm-5.3") %>
    effort: low
  # The cheapest priced model (config/llm_pricing.yml), for bulk work: sponsor detection and a fit search's summary.
  cheap:
    model: <%= ENV.fetch("LLM_CHEAP_MODEL", "deepseek/deepseek-v4.1-flash") %>
    effort: low
  # The research run's Qloo call caps live in config/research.yml (R93).
