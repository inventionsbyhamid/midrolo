name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run specs
        run: bundle exec rspec

      - name: Lint
        run: bin/rubocop -f github

      - name: Brakeman
        run: bin/brakeman -q

      - name: Bundler audit
        run: bundle exec bundler-audit check --update

  # bin/platform-stats, the Spotify and Apple stats helper: Python 3.11 as in the Docker image (bookworm), the
  # hash pinned libraries, the unit tests (no network) and the offline self-test.
  platform-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-stats.txt

      - name: Install the stats helper's libraries
        run: python -m pip install --require-hashes -r requirements-stats.txt

      - name: Stats helper unit tests
        run: python -m unittest discover -s test/python -v

      - name: Stats helper self-test
        run: bin/platform-stats --self-test
