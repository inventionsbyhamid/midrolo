# Midrolo's production stack on ioflood (docs/deploy.md). Build and run it there, never on the Mac.
#
# ioflood is a shared production server: everything here is named midrolo-* (project, service keys, containers,
# images, network, volumes, Traefik routers, services and middlewares), so nothing can collide with another stack.
# That includes DNS: compose makes each service key an alias on every network the service joins, and midrolo-web
# joins the shared coolify network, where a bare "web" could answer another app's lookups (R115). No port is
# published on the host: Coolify's Traefik reaches midrolo-web over the external coolify network and routes
# midrolo.com to it by the labels below. The other containers sit only on midrolo-net, this stack's own bridge
# network, which no other stack joins (not `internal: true`, since jobs and backups need outbound HTTPS).
#
# Every service runs with at most 2 CPUs, 2 GB and 512 processes, restarts unless stopped by hand, and rotates its logs.

name: midrolo

services:
  # Thruster on port 80 in front of Puma. Its entrypoint runs db:prepare before the server starts.
  midrolo-web:
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "2", memory: 2G } } }
    pids_limit: 512
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    build: .
    image: midrolo-app:latest
    container_name: midrolo-web
    env_file: .env
    # Puma's 3 threads with database.yml's pool of 5 (Action Cable shares it), so no RAILS_MAX_THREADS here; and no
    # SOLID_QUEUE_IN_PUMA, since the jobs container runs Solid Queue.
    environment:
      DB_HOST: midrolo-db
    depends_on:
      midrolo-db:
        condition: service_healthy
    networks:
      - midrolo
      - coolify
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost/up" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s # the first boot creates the databases
    stop_grace_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.services.midrolo-web.loadbalancer.server.port=80
      # http: redirect to https, for the apex and www.
      - traefik.http.middlewares.midrolo-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.midrolo-https-redirect.redirectscheme.permanent=true
      - traefik.http.routers.midrolo-http.entrypoints=http
      - traefik.http.routers.midrolo-http.rule=Host(`midrolo.com`) || Host(`www.midrolo.com`)
      - traefik.http.routers.midrolo-http.middlewares=midrolo-https-redirect
      - traefik.http.routers.midrolo-http.service=midrolo-web
      # https: the site, with a Let's Encrypt certificate.
      - traefik.http.routers.midrolo-https.entrypoints=https
      - traefik.http.routers.midrolo-https.rule=Host(`midrolo.com`)
      - traefik.http.routers.midrolo-https.tls=true
      - traefik.http.routers.midrolo-https.tls.certresolver=letsencrypt
      - traefik.http.routers.midrolo-https.service=midrolo-web
      # https://www: a permanent redirect to the apex ($$ is a literal $ to compose).
      - traefik.http.middlewares.midrolo-www-redirect.redirectregex.regex=^https?://www\.midrolo\.com/(.*)
      - traefik.http.middlewares.midrolo-www-redirect.redirectregex.replacement=https://midrolo.com/$${1}
      - traefik.http.middlewares.midrolo-www-redirect.redirectregex.permanent=true
      - traefik.http.routers.midrolo-www.entrypoints=https
      - traefik.http.routers.midrolo-www.rule=Host(`www.midrolo.com`)
      - traefik.http.routers.midrolo-www.tls=true
      - traefik.http.routers.midrolo-www.tls.certresolver=letsencrypt
      - traefik.http.routers.midrolo-www.middlewares=midrolo-www-redirect
      - traefik.http.routers.midrolo-www.service=midrolo-web

  # Solid Queue: every queue in config/queue.yml (default and solid_queue_recurring on 3 threads, artwork on 1), with
  # outbound HTTPS for Qloo, the LLM, feeds, artwork and R2.
  midrolo-jobs:
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "2", memory: 2G } } }
    pids_limit: 512
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    image: midrolo-app:latest # built by midrolo-web; never pulled from a registry
    pull_policy: never
    container_name: midrolo-jobs
    command: [ "./bin/jobs" ]
    env_file: .env
    environment:
      DB_HOST: midrolo-db
      RAILS_MAX_THREADS: "6" # the connection pool: every job thread in config/queue.yml (3 + 1), plus 2 for Solid Queue
    depends_on:
      midrolo-web:
        condition: service_healthy # its entrypoint has prepared the databases
    networks:
      - midrolo
    healthcheck:
      # Both workers in config/queue.yml have sent a heartbeat (every minute) in the last 3 minutes.
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$MIDROLO_DATABASE_PASSWORD" psql -qtA -h "$$DB_HOST" -U midrolo -d midrolo_production_queue
          -c "SELECT count(*) >= 2 FROM solid_queue_processes WHERE kind = 'Worker'
          AND last_heartbeat_at > now() - interval '3 minutes'" | grep -qx t
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    stop_grace_period: 30s

  midrolo-db:
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "2", memory: 2G } } }
    pids_limit: 512
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    image: postgres:16
    container_name: midrolo-db
    environment:
      POSTGRES_USER: midrolo
      POSTGRES_PASSWORD: ${MIDROLO_DATABASE_PASSWORD:?set MIDROLO_DATABASE_PASSWORD in .env}
      POSTGRES_DB: midrolo_production
    volumes:
      - midrolo-db:/var/lib/postgresql/data
    networks:
      - midrolo
    healthcheck:
      test: [ "CMD", "pg_isready", "--username", "midrolo", "--dbname", "midrolo_production" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  # bin/backup every night at 03:00 UTC: pg_dump | gzip to R2_BACKUP_BUCKET, keeping 14 days. Unhealthy from a failed
  # run until a later one succeeds.
  midrolo-backup:
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "2", memory: 2G } } }
    pids_limit: 512
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: midrolo-backup:latest
    container_name: midrolo-backup
    command: [ "backup", "daily" ]
    init: true # signals reach the scheduling loop
    environment:
      PGHOST: midrolo-db
      PGUSER: midrolo
      PGPASSWORD: ${MIDROLO_DATABASE_PASSWORD:?set MIDROLO_DATABASE_PASSWORD in .env}
      PGDATABASE: midrolo_production
      # Its own R2 token, scoped to the backup bucket alone: the app's token can't touch the backups, nor this one
      # the uploads.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?set R2_ACCOUNT_ID in .env}
      BACKUP_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:?set BACKUP_R2_ACCESS_KEY_ID in .env}
      BACKUP_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:?set BACKUP_R2_SECRET_ACCESS_KEY in .env}
      R2_BACKUP_BUCKET: ${R2_BACKUP_BUCKET:?set R2_BACKUP_BUCKET in .env}
      # Where a failed run is recorded, on a volume, so a restart or a redeploy doesn't forget it.
      BACKUP_STATE_DIR: /var/lib/midrolo-backup
    volumes:
      - midrolo-backup-state:/var/lib/midrolo-backup
    depends_on:
      midrolo-db:
        condition: service_healthy
    networks:
      - midrolo
    healthcheck:
      test: [ "CMD", "backup", "health" ]
      interval: 60s
      timeout: 5s
      retries: 1

volumes:
  midrolo-db:
    name: midrolo-db
  midrolo-backup-state:
    name: midrolo-backup-state

networks:
  midrolo:
    name: midrolo-net
  coolify:
    external: true
