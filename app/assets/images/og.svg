    Pango doesn't read "Expanded" in a family name as a stretch. With those static instances from Google Fonts in a
    fontconfig directory, render with:
      PANGOCAIRO_BACKEND=fc FONTCONFIG_FILE=path/to/fonts.conf vips copy og.svg og.png
    The match card is an illustration: brands appear as category labels with a blank logo tile, never as invented
    brand names (R89).
  -->
